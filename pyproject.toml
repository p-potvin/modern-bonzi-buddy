[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modern-bonzi-buddy"
version = "0.1.0"
description = "Realtime AST + TTS desktop scaffold with PySide6 and Gemini Flash TTS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7.0",
  "google-genai>=0.5.0",
  "numpy>=1.26.0",
  "sounddevice>=0.4.6",
  "soundfile>=0.12.1",
  "silero-vad>=5.1.2",
  "torch>=2.3.0",
  "torchaudio>=2.3.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
modern-bonzi-buddy = "modern_bonzi_buddy.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
